name: Supabase Keepalive
on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at 12:00 UTC
  workflow_dispatch: {}      # allows manual trigger from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://yywqmbyymfdxaqtfvanc.supabase.co/rest/v1/media?select=slot&limit=1&apikey=sb_publishable_Rok4eIsXskXiYHvVBcoLuA_ZGv4kzFS")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP status: $code"
          echo "Body: $body"
          if [ "$code" -ne 200 ]; then
            echo "Keepalive ping failed with status $code"
            exit 1
          fi
